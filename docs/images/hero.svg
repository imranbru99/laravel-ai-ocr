<g fill="#f1faf9" font-size="23" font-weight="600"><text x="66" y="402">23 document types</text><text x="440" y="402">5 extraction strategies</text><text x="885" y="402">Local + AI processing</text></g>
<g fill="#8eafaf" font-size="15"><text x="66" y="434">Invoices, receipts, identity, shipping and more</text><text x="440" y="434">Choose the workflow your business needs</text><text x="885" y="434">Privacy policies and visible usage</text></g>
<text x="66" y="475" fill="#6e9799" font-size="13">BY IMRAN AHMED · IMRANDEV.BD</text></g></svg>
